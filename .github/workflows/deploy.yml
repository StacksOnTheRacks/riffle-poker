name: Deploy Match Runtime

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    # Environment-scoped vars are not visible to a job-level `if`, so the check lives in a step.
    steps:
      - name: Require deploy role
        if: vars.AWS_DEPLOY_ROLE_ARN == ''
        run: |
          echo 'AWS_DEPLOY_ROLE_ARN is not configured for environment production.'
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build dashboard play SPA
        run: npm run build:client

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: infra/cdk/package-lock.json

      - run: npm ci
        working-directory: infra/cdk

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Deploy MatchRuntimeStack
        working-directory: infra/cdk
        run: >
          npx cdk deploy MatchRuntimeStack
          --require-approval never
          --toolkit-stack-name RifflePokerMatchToolkit
          --context @aws-cdk/core:bootstrapQualifier=rifflepk
